name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cmpys/backend/**"
      - "cmpys/infra/**"
      - "cmpys/prompts/**"
      - ".github/workflows/deploy.yml"

env:
  AWS_REGION: us-east-1

concurrency:
  group: cmpys-production-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://cmpys:cmpys@localhost:5432/cmpys
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cmpys
          POSTGRES_PASSWORD: cmpys
          POSTGRES_DB: cmpys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cmpys -d cmpys"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cmpys/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r cmpys/backend/requirements.txt

      - name: Migrate clean pgvector database
        working-directory: cmpys/backend
        run: python -m alembic upgrade head

      - name: Run tests
        run: |
          cd cmpys/backend
          python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        env:
          ECR_URL: ${{ secrets.ECR_URL }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # The EC2 host is arm64 (Graviton) but the runner is amd64. Build for
          # the target platform via buildx+QEMU, otherwise the image fails on the
          # server with "exec format error". buildx --push builds and pushes in
          # one step (a cross-platform image can't be `docker push`ed normally).
          docker buildx build --platform linux/arm64 \
            -f cmpys/backend/Dockerfile \
            -t $ECR_URL:$IMAGE_TAG \
            --push cmpys

      - name: Deploy to EC2
        env:
          ECR_URL: ${{ secrets.ECR_URL }}
          IMAGE_TAG: ${{ github.sha }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Write the key robustly. `echo` plus a secret that has CRLF endings or
          # no trailing newline yields a key OpenSSH can't parse ("error in
          # libcrypto"). printf preserves the body, sed strips stray CRs, and the
          # format guarantees a trailing newline.
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" | sed 's/\r$//' > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          # Fail fast with a clear message if the key itself is malformed, so we
          # don't get an opaque "Permission denied (publickey)" downstream. If
          # this passes but SSH is still denied, the key is valid and the issue
          # is the matching public key missing from the server's authorized_keys.
          if ! ssh-keygen -y -f /tmp/deploy_key > /dev/null 2>&1; then
            echo "::error::SSH_PRIVATE_KEY is not a valid OpenSSH private key. Re-add the secret with the full key body and a trailing newline (no CRLF)."
            rm -f /tmp/deploy_key
            exit 1
          fi

          # Preserve the compose topology that matches the currently running
          # image before replacing release tooling. The remote rollback path
          # restores this file before it starts the previous image.
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            ec2-user@$SERVER_IP \
            "cp /opt/cmpys/docker-compose.prod.yml \
             /opt/cmpys/docker-compose.prod.yml.rollback-$IMAGE_TAG"

          # Copy updated compose file and deploy script to server.
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            cmpys/infra/docker-compose.prod.yml \
            cmpys/infra/deploy.sh \
            ec2-user@$SERVER_IP:/opt/cmpys/

          # Run the deploy script on the server
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            ec2-user@$SERVER_IP \
            "chmod +x /opt/cmpys/deploy.sh && \
             /opt/cmpys/deploy.sh $ECR_URL $IMAGE_TAG ${{ env.AWS_REGION }}"

          # The instance role is intentionally pull-only. Promote the stable
          # alias from CI, using its ECR write credentials, only after the
          # remote script has passed migrations, readiness, and worker checks.
          docker buildx imagetools create \
            --tag $ECR_URL:latest \
            $ECR_URL:$IMAGE_TAG

          rm -f /tmp/deploy_key
